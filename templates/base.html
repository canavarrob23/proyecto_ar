<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crud Flask-SQLite {% block pestana %} {% endblock %} </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

</head>
<body>
    <div class="container">
        {% block titulo %} {% endblock %}
    </div>    
    <div class="container">
        <!-- BARRA DE NAVEGACION -->
        <nav class="navbar-nav bg-primary mt-3 mb-3" data-bs-theme="dark">
            <!-- <ul class="nav nav-tabs"> -->
            <ul class="nav">
                <li>
                    <!-- *** url_for *** solo se usan con los metodos es decir (def), 
                         Y NO con los decoradores 
                     -->
                    <a class="btn btn-primary" href="{{ url_for('home') }}">Inicio</a>
                </li>
                <li>
                    <a class="btn btn-primary" href="{{ url_for('crud_producto') }}">Mant Productos</a>
                </li>
                <li>
                    <a class="btn btn-primary" href="{{ url_for('producto') }}">Crear Prod</a>
                </li>
                <li>
                    <a class="btn btn-primary" href="{{ url_for('editar') }}">Editar</a>
                </li>
                <li>
                    <a class="btn btn-primary" href="{{ url_for('contacto') }}">Contactos</a>
                </li>
                <li>
                    <a class="btn btn-primary" href="{{ url_for('lista_prod') }}">Lista Prod</a>
                </li>
            </ul>
        </nav>
          
    </div>
    <!-- BLOQUE CONTENIDO DE CADA PAGINA -->
    <div class="container">
        {% block contenido %}          {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <script src="{{url_for('static', filename='js/main.js')}}"></script>
</body>
</html>
